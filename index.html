<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tiny Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #15122b;
    --paper: #fff8e7;
    --pop: #ffd23f;
    --hot: #ff5d73;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #241a5c;
    font-family: "Bangers", "Impact", "Arial Black", sans-serif;
  }
  /* Comic-book space: gradient + halftone dots */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle, rgba(255,255,255,0.13) 1.6px, transparent 2px) 0 0 / 14px 14px,
      radial-gradient(ellipse at 30% 25%, #5b3fc4 0%, #33237f 45%, #160f3a 100%);
    z-index: -1;
  }
  canvas { display: block; outline: none; touch-action: none; }

  .title {
    position: fixed;
    top: 14px;
    left: 18px;
    margin: 0;
    font-size: clamp(34px, 6vw, 64px);
    letter-spacing: 2px;
    color: var(--pop);
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 4px 4px 0 var(--hot), 7px 7px 0 var(--ink);
    transform: rotate(-4deg);
    pointer-events: none;
    user-select: none;
  }
  .bubble {
    position: fixed;
    left: 18px;
    bottom: 18px;
    max-width: min(340px, calc(100vw - 36px));
    box-sizing: border-box;
    padding: 10px 14px;
    background: var(--paper);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 5px 5px 0 var(--ink);
    font-family: "Comic Sans MS", "Comic Neue", "Trebuchet MS", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble b { font-family: "Bangers", "Impact", sans-serif; font-weight: normal; letter-spacing: 1px; font-size: 16px; }
  .buttons {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .buttons button {
    font-family: inherit;
    font-size: 20px;
    letter-spacing: 1px;
    padding: 6px 14px;
    color: var(--ink);
    background: var(--pop);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
  }
  .buttons button:hover { background: #ffe477; }
  .buttons button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .buttons button.off { background: #ddd6c4; }
  @media (max-width: 600px) {
    .bubble { bottom: auto; top: 86px; font-size: 12px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<h1 class="title">TINY PLANET!</h1>
<div class="bubble">
  <b>Welcome, giant!</b><br />
  Drag to orbit &middot; scroll / pinch to zoom &middot; right-drag to pan.<br />
  <b>Double-click</b> anything to fly in close.
</div>
<div class="buttons">
  <button id="spin">Auto-spin: ON</button>
  <button id="reset">Reset view</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------------------
// Basics
// ---------------------------------------------------------------------------
const R = 10;               // planet radius
const GROUND = R + 0.2;     // flattened ground level for cities / roads
const ROAD_H = R + 0.24;    // road surface radius
const ROAD_W = 0.03;        // road half-width (radians)
const CITY_R = 0.17;        // city radius (radians)

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20240923);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

function randomDir() {
  const u = rand() * 2 - 1, th = rand() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  return new THREE.Vector3(s * Math.cos(th), u, s * Math.sin(th));
}

// Classic 3D Perlin noise
const perm = new Uint8Array(512);
{
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y, z) {
  h &= 15;
  const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}
function noise3(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
  const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
         lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}
function fbm(x, y, z, oct) {
  let sum = 0, amp = 1, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * noise3(x * f, y * f, z * f); norm += amp; amp *= 0.5; f *= 2; }
  return sum / norm;
}

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.03, 600);
camera.position.set(22, 16, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6;
controls.maxDistance = 80;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.zoomSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6b4a8a, 1.3));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(30, 22, 18);
scene.add(sun);

// Cel-shading ramp
const gradientMap = new THREE.DataTexture(new Uint8Array([70, 150, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const matCache = new Map();
function toon(color, extra = {}) {
  const key = color + JSON.stringify(Object.keys(extra));
  if (!extra.map && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
  if (!extra.map) matCache.set(key, m);
  return m;
}
const VCOLOR = toon(0xffffff, { vertexColors: true });
const INK = new THREE.MeshBasicMaterial({ color: 0x15122b, side: THREE.BackSide });

// Inverted-hull outline: grow a geometry around its bbox centre by t world units per side
function outlineGeo(geo, t = 0.02) {
  const g = geo.clone();
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3());
  const s = g.boundingBox.getSize(new THREE.Vector3());
  const k = new THREE.Vector3(
    s.x > 1e-6 ? (s.x + 2 * t) / s.x : 1,
    s.y > 1e-6 ? (s.y + 2 * t) / s.y : 1,
    s.z > 1e-6 ? (s.z + 2 * t) / s.z : 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setXYZ(i, c.x + (p.getX(i) - c.x) * k.x, c.y + (p.getY(i) - c.y) * k.y, c.z + (p.getZ(i) - c.z) * k.z);
  }
  return g;
}
function outlined(geo, mat, t = 0.02) {
  const m = new THREE.Mesh(geo, mat);
  m.add(new THREE.Mesh(outlineGeo(geo, t), INK));
  return m;
}

// Build one merged, vertex-coloured mesh (+ outline) from primitive parts
function part(geo, color, pos = [0, 0, 0], rot = [0, 0, 0], scale = [1, 1, 1]) {
  return { geo, color, matrix: new THREE.Matrix4().compose(
    new THREE.Vector3(...pos), new THREE.Quaternion().setFromEuler(new THREE.Euler(...rot)), new THREE.Vector3(...scale)) };
}
function paint(geo, color) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  const c = new THREE.Color(color);
  const arr = new Float32Array(g.attributes.position.count * 3);
  for (let i = 0; i < arr.length; i += 3) { arr[i] = c.r; arr[i + 1] = c.g; arr[i + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
function mergeParts(parts, t = 0.02, extraMatrix = null) {
  const body = [], ink = [];
  for (const p of parts) {
    const m = extraMatrix ? extraMatrix.clone().multiply(p.matrix) : p.matrix;
    body.push(paint(p.geo, p.color).applyMatrix4(m));
    if (t > 0 && !p.noOutline) {
      const o = outlineGeo(p.geo, t);
      ink.push((o.index ? o.toNonIndexed() : o).applyMatrix4(m));
    }
  }
  const strip = (g) => { for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal') g.deleteAttribute(k); return g; };
  return { body: mergeGeometries(body), ink: ink.length ? mergeGeometries(ink.map(strip)) : null };
}
function mergedMesh(parts, t = 0.02, mat = VCOLOR) {
  const { body, ink } = mergeParts(parts, t);
  const m = new THREE.Mesh(body, mat);
  if (ink) m.add(new THREE.Mesh(ink, INK));
  return m;
}

// Orientation: local +Y = up (surface normal), local +X towards `hint`
const _m4 = new THREE.Matrix4();
function surfaceQuat(up, hint) {
  const y = up.clone().normalize();
  let x = hint.clone().addScaledVector(y, -hint.dot(y));
  if (x.lengthSq() < 1e-6) x = new THREE.Vector3(1, 0, 0).addScaledVector(y, -y.x);
  x.normalize();
  const z = new THREE.Vector3().crossVectors(x, y);
  return new THREE.Quaternion().setFromRotationMatrix(_m4.makeBasis(x, y, z));
}

// ---------------------------------------------------------------------------
// Terrain height field
// ---------------------------------------------------------------------------
function rawElev(d) {
  return fbm(d.x * 1.35 + 5.2, d.y * 1.35 - 3.1, d.z * 1.35 + 7.7, 5) * 1.9 + 0.05;
}
function rawRadius(d) {
  const e = rawElev(d);
  if (e < 0) return R + Math.max(e * 3.2, -2.2);
  const ridge = 1 - Math.abs(noise3(d.x * 3.6 + 11, d.y * 3.6, d.z * 3.6 - 4));
  const mnt = smoothstep(0.16, 0.45, e);
  return R + 0.15 + e * 1.1 + ridge * ridge * ridge * mnt * 1.7;
}

// Roads are great circles; pick normals that are well spread out
const roads = [];
{
  const normals = [
    new THREE.Vector3(0.15, 1, 0.1),
    new THREE.Vector3(1, 0.35, -0.3),
    new THREE.Vector3(-0.35, 0.3, 1),
  ];
  normals.forEach((n, i) => {
    n.normalize();
    const u = new THREE.Vector3(0, 0, 1).cross(n);
    if (u.lengthSq() < 1e-4) u.set(1, 0, 0);
    u.normalize();
    const v = new THREE.Vector3().crossVectors(n, u).normalize();
    roads.push({ n, u, v, h: ROAD_H + i * 0.006 });
  });
}
const roadPoint = (road, th, out = new THREE.Vector3()) =>
  out.copy(road.u).multiplyScalar(Math.cos(th)).addScaledVector(road.v, Math.sin(th));

// Cities: sit on roads where the land is not too rugged (a few more off-road)
const cities = [];
function cityScore(d, tangent) {
  const side = new THREE.Vector3().crossVectors(d, tangent);
  let land = 0;
  for (let a = -1; a <= 1; a++) {
    for (let b = -1; b <= 1; b++) {
      const q = d.clone().addScaledVector(tangent, a * CITY_R * 0.8).addScaledVector(side, b * CITY_R * 0.8).normalize();
      const r = rawRadius(q);
      if (r > R + 1.3) return 0;
      if (r > R) land++;
    }
  }
  return rawRadius(d) > R && rawRadius(d) < R + 0.9 ? land : 0;
}
for (const road of roads) {
  const samples = 360;
  let found = 0;
  const start = Math.floor(rand() * samples);
  for (let k = 0; k < samples && found < 2; k += 3) {
    const th = ((start + k) % samples) / samples * Math.PI * 2;
    const d = roadPoint(road, th);
    if (cityScore(d, roadPoint(road, th + Math.PI / 2)) < 6) continue;
    if (cities.some((c) => c.dir.angleTo(d) < 0.7)) continue;
    cities.push({ dir: d.clone(), tangent: roadPoint(road, th + Math.PI / 2) });
    found++;
  }
}
for (let tries = 0; cities.length < 7 && tries < 3000; tries++) {
  const d = randomDir();
  const tangent = randomDir().cross(d).normalize();
  if (cityScore(d, tangent) < 7) continue;
  if (cities.some((c) => c.dir.angleTo(d) < 0.7)) continue;
  if (roads.some((rd) => Math.abs(d.dot(rd.n)) < CITY_R * 1.6)) continue;
  cities.push({ dir: d, tangent });
}

function terrainInfo(d) {
  const raw = rawRadius(d);
  let r = raw, city = 0, road = 0;
  if (raw > R) {
    for (const rd of roads) {
      const m = 1 - smoothstep(ROAD_W * 1.4, ROAD_W * 3.4, Math.abs(d.dot(rd.n)));
      road = Math.max(road, m);
    }
    r = lerp(r, GROUND - 0.02, road);
  }
  for (const c of cities) {
    const m = 1 - smoothstep(CITY_R, CITY_R * 1.4, d.angleTo(c.dir));
    if (m > 0) { r = lerp(r, GROUND, m); city = Math.max(city, m); }
  }
  return { r, raw, city, road };
}
const groundR = (d) => terrainInfo(d).r;

// ---------------------------------------------------------------------------
// Planet mesh
// ---------------------------------------------------------------------------
const PALETTE = {
  deep: new THREE.Color('#1e5fa0'),
  mid: new THREE.Color('#2f93c6'),
  shallow: new THREE.Color('#7fe0d6'),
  sand: new THREE.Color('#ffe08a'),
  grass1: new THREE.Color('#9be35a'),
  grass2: new THREE.Color('#5fcb45'),
  forest: new THREE.Color('#37a24e'),
  rock: new THREE.Color('#b0825a'),
  rock2: new THREE.Color('#8f86a8'),
  snow: new THREE.Color('#ffffff'),
  city: new THREE.Color('#d9d2c3'),
};
function groundColor(h, city, road) {
  if (city > 0.55) return PALETTE.city;
  if (h < -0.9) return PALETTE.deep;
  if (h < -0.35) return PALETTE.mid;
  if (h < 0.1) return PALETTE.shallow;
  if (road > 0.5) return PALETTE.grass1;
  if (h < 0.19) return PALETTE.sand;
  if (h < 0.45) return PALETTE.grass1;
  if (h < 0.85) return PALETTE.grass2;
  if (h < 1.3) return PALETTE.forest;
  if (h < 1.9) return PALETTE.rock;
  if (h < 2.5) return PALETTE.rock2;
  return PALETTE.snow;
}

const planet = new THREE.Group();
scene.add(planet);
{
  const geo = new THREE.IcosahedronGeometry(1, 64);
  const pos = geo.attributes.position;
  const cache = new Map();
  const infos = new Array(pos.count);
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const key = `${v.x.toFixed(5)},${v.y.toFixed(5)},${v.z.toFixed(5)}`;
    let info = cache.get(key);
    if (!info) { info = terrainInfo(v); cache.set(key, info); }
    infos[i] = info;
    pos.setXYZ(i, v.x * info.r, v.y * info.r, v.z * info.r);
  }
  const colors = new Float32Array(pos.count * 3);
  const col = new THREE.Color();
  for (let i = 0; i < pos.count; i += 3) {
    const a = infos[i], b = infos[i + 1], c = infos[i + 2];
    const h = (a.r + b.r + c.r) / 3 - R;
    const top = Math.max(a.r, b.r, c.r) - R;
    const city = Math.min(a.city, b.city, c.city);
    const road = Math.min(a.road, b.road, c.road);
    col.copy(groundColor(top > 2.5 ? top : h, city, road));
    const jitter = 0.94 + rand() * 0.1;
    col.multiplyScalar(jitter);
    for (let k = 0; k < 3; k++) colors.set([col.r, col.g, col.b], (i + k) * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, toon(0xffffff, { vertexColors: true }));
  terrain.name = 'terrain';
  planet.add(terrain);

  // Outline hull: push every vertex outward radially
  const ink = new THREE.BufferGeometry();
  const ip = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const len = v.length();
    v.multiplyScalar((len + 0.045) / len);
    ip.set([v.x, v.y, v.z], i * 3);
  }
  ink.setAttribute('position', new THREE.BufferAttribute(ip, 3));
  planet.add(new THREE.Mesh(ink, INK));
}

// Ocean with gentle toon waves
const oceanUniforms = { uTime: { value: 0 } };
{
  const mat = new THREE.MeshToonMaterial({
    color: 0x3cb8ee, gradientMap, transparent: true, opacity: 0.78,
  });
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = oceanUniforms.uTime;
    shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       float w = sin(position.x * 1.7 + uTime * 1.3) * sin(position.z * 1.9 + uTime * 1.1) * sin(position.y * 1.5 + uTime);
       transformed += normal * w * 0.05;`);
  };
  const ocean = new THREE.Mesh(new THREE.IcosahedronGeometry(R, 24), mat);
  ocean.renderOrder = 2;
  planet.add(ocean);
  const rim = new THREE.Mesh(new THREE.SphereGeometry(R + 0.08, 64, 48), INK);
  planet.add(rim);
}

// ---------------------------------------------------------------------------
// Roads + bridges
// ---------------------------------------------------------------------------
function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#4b4a5e'; g.fillRect(0, 0, 64, 128);
  g.fillStyle = '#f3efe2'; g.fillRect(4, 0, 4, 128); g.fillRect(56, 0, 4, 128);
  g.fillStyle = '#ffd23f'; g.fillRect(29, 10, 6, 60);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const roadTex = makeRoadTexture();
const roadMat = toon(0xffffff, { map: roadTex, side: THREE.DoubleSide });
const roadInk = new THREE.MeshBasicMaterial({ color: 0x15122b, side: THREE.DoubleSide });

function bandGeometry(road, halfW, h, uvScale) {
  const N = 900;
  const pos = [], nor = [], uv = [], idx = [];
  const p = new THREE.Vector3(), q = new THREE.Vector3();
  for (let i = 0; i <= N; i++) {
    const th = (i / N) * Math.PI * 2;
    roadPoint(road, th, p);
    for (const side of [-1, 1]) {
      q.copy(p).addScaledVector(road.n, side * halfW).normalize();
      nor.push(q.x, q.y, q.z);
      q.multiplyScalar(h);
      pos.push(q.x, q.y, q.z);
      uv.push(side < 0 ? 0 : 1, th * h * uvScale);
    }
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
{
  const pillarParts = [];
  const pillarGeo = new THREE.CylinderGeometry(0.05, 0.07, 1, 6).translate(0, 0.5, 0);
  for (const road of roads) {
    planet.add(new THREE.Mesh(bandGeometry(road, ROAD_W, road.h, 1.1), roadMat));
    const border = new THREE.Mesh(bandGeometry(road, ROAD_W * 1.2, road.h - 0.012, 1), roadInk);
    planet.add(border);
    // bridge pillars wherever the road crosses water
    const steps = 140;
    for (let i = 0; i < steps; i++) {
      const th = (i / steps) * Math.PI * 2;
      const d = roadPoint(road, th);
      const raw = rawRadius(d);
      if (raw > R + 0.05) continue;
      const bottom = Math.max(raw - 0.2, R - 2.5);
      for (const side of [-0.8, 0.8]) {
        const pd = d.clone().addScaledVector(road.n, side * ROAD_W).normalize();
        const m = new THREE.Matrix4().compose(
          pd.clone().multiplyScalar(bottom), surfaceQuat(pd, road.n), new THREE.Vector3(1, road.h - bottom - 0.02, 1));
        pillarParts.push({ geo: pillarGeo, color: '#e9e2d0', matrix: m });
      }

  updateCars(dt, time);
  for (const c of clouds) c.arm.rotation.z += c.speed * dt;
  for (const p of planes) {
    p.arm.rotation.z -= p.speed * dt;
    p.plane.position.y = p.alt + Math.sin(time * 1.3 + p.phase) * 0.15;
    p.plane.rotation.x = Math.sin(time * 0.9 + p.phase) * 0.25;
    p.plane.userData.prop.rotation.x += dt * 40;
    const flag = p.plane.userData.flag;
    if (flag) {
      const pos = flag.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        pos.setZ(i, Math.sin(x * 6 + time * 10) * 0.04 * (0.6 - x));
      }
      pos.needsUpdate = true;
    }
  }
  for (const b of balloons) {
    b.arm.rotation.z += b.speed * dt;
    b.g.position.y = b.baseY + Math.sin(time * 0.7 + b.phase) * 0.2;
    b.g.rotation.y += dt * 0.2;
  }
  moonPivot.rotation.y += dt * 0.03;

  if (flight) {
    flight.t = Math.min(1, flight.t + dt / 1.4);
    const k = flight.t < 0.5 ? 4 * flight.t ** 3 : 1 - Math.pow(-2 * flight.t + 2, 3) / 2;
    controls.target.lerpVectors(flight.fromTarget, flight.toTarget, k);
    camera.position.lerpVectors(flight.fromCam, flight.toCam, k);
    if (flight.t >= 1) flight = null;
  }
  controls.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

// handy for poking around from the dev console
window.tinyPlanet = { scene, camera, controls, cities, roads };
</script>
